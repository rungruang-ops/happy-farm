name: CI

on:
  push:
    branches:
      - main
      - feature/factory-setup
  pull_request:
    branches:
      - main
      - feature/factory-setup

jobs:
  validate:
    name: Validate project content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate CSV content files
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          required = [
              Path('content/items.csv'),
              Path('content/levels.csv'),
              Path('content/phrases.csv'),
              Path('content/art.csv'),
          ]

          for path in required:
              if not path.exists():
                  raise FileNotFoundError(f'Missing required file: {path}')

              with path.open(newline='', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  if reader.fieldnames is None:
                      raise ValueError(f'{path} is missing CSV headers')

                  headers = [h.strip() for h in reader.fieldnames]
                  if not headers:
                      raise ValueError(f'{path} has empty headers')

          print('All content CSV files are readable and have headers.')
          PY

      - name: Check project structure
        run: |
          test -f project.godot
          test -f Makefile
          test -f requirements.txt
          test -d content
          test -d autoload
          test -d core
          test -d game
          test -d ui
          test -d screens
          test -d tools

      - name: Compile Python helper scripts
        run: |
          python -m compileall tools autoload core game ui screens

      - name: Check Git status
        run: git status --short
